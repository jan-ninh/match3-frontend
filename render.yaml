# Local preparation only. Importing/creating this Blueprint in Render is a deployment
# action and needs separate approval. Rename the service and enter the actual API origin.
services:
  - type: web
    runtime: static
    name: match3-frontend
    branch: portfolio-refresh
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
